<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Download Library Host</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #0070d1; margin-bottom: 5px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .url-box {
            background: #1c2230;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #0070d1;
            margin-bottom: 30px;
            word-break: break-all;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #161b26;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; border-radius: 5px; height: 250px; object-fit: cover; }
        .card h3 { font-size: 16px; margin: 10px 0 5px 0; height: 40px; overflow: hidden; }
        .info { font-size: 12px; color: #8892b0; margin-bottom: 10px; }
        .btn-dl {
            display: inline-block;
            background: #0070d1;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-dl:hover { background: #0056a3; }
    </style>
</head>
<body>

<div class="container">
    <h1>PS5 Game & App Library</h1>
    <p>Masukkan URL Katalog di bawah ini ke pengaturan aplikasi PS5 Library kamu:</p>
    
    <div class="url-box">
        <strong style="color: #00ffcc;">URL KATALOG ANDA:</strong><br>
        <span id="katalog-url">https://github.io</span>
    </div>

    <h2>Daftar Game Tersedia</h2>
    <div class="grid" id="game-grid">Cari data game...</div>
</div>

<script>
    // Mengambil data dari catalog.json secara otomatis
    fetch('catalog.json')
        .then(response => response.json())
        .then(data => {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = ''; // bersihkan teks loading
            
            data.entries.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Gunakan gambar default jika cover tidak diset
                const coverImg = game.cover || 'https://placeholder.com';
                
                card.innerHTML = `
                    <img src="${coverImg}" alt="${game.title}">
                    <h3>${game.title}</h3>
                    <div class="info">${game.title_id} | ${game.size} | ${game.format.toUpperCase()}</div>
                    <a href="${game.files[0].url}" class="btn-dl" target="_blank">Download File</a>
                `;
                grid.appendChild(card);
            });
        })
        .catch(err => {
            document.getElementById('game-grid').innerHTML = 'Gagal memuat katalog game.';
            console.error(err);
        });

    // Otomatis menyesuaikan teks URL berdasarkan domain github.io kamu
    document.getElementById('katalog-url').innerText = window.location.href.replace(/\/\$/, '') + '/catalog.json';
</script>
</body>
</html>
